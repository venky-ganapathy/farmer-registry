# 8h in-cluster soak. Locust users stay at SOAK_USERS. A headless Service
# lets each user keep-alive to one pod (round-robin) so CPU stays even.
# SOAK_MAX_RPS holds total HTTP rate so pods stay near 1.7-1.8 cores.
#
# Locust writes CSVs to emptyDir. When Locust exits the container MUST stay
# Running (sleep) or kubectl cp fails and the files are gone. Morning copy:
#   kubectl -n perftest logs job/locust-staff-soak | grep SOAK_FINISHED
#   POD=$(kubectl -n perftest get pod -l job-name=locust-staff-soak -o jsonpath='{.items[0].metadata.name}')
#   kubectl -n perftest cp "$POD:/results/staff-api/in-cluster/." \
#     ./results/staff-api/in-cluster/
# Then delete the Job. activeDeadlineSeconds is 24h so a hung run dies, but
# an 8h soak plus morning collection still fits.
apiVersion: v1
kind: Service
metadata:
  name: locust-staff-api-pods
  namespace: perftest
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: staff-portal-api
    app.kubernetes.io/instance: farmer-registry
    app.kubernetes.io/name: registry
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: locust-staff-soak
  namespace: perftest
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 86400
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: locust
          image: vin0dkhichar/locust-staff-soak:latest
          imagePullPolicy: Always
          workingDir: /app
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -uo pipefail
              CSV_PREFIX="/results/staff-api/in-cluster/primary/pod-3/3-soak/soak"
              mkdir -p "$(dirname "$CSV_PREFIX")"
              echo "=== soak ==="
              echo "SOAK_USERS=${SOAK_USERS} SOAK_MAX_RPS=${SOAK_MAX_RPS} -t 8h"
              echo "csv=${CSV_PREFIX}"
              echo "STAFF_API=${STAFF_API_BASE}"
              echo "======================"
              set +e
              locust -f staff-api/blended/soak_locustfile.py --headless \
                --host "$STAFF_API_BASE" \
                -u "$SOAK_USERS" -r 2 -t 8h --csv "$CSV_PREFIX"
              locust_rc=$?
              set -e
              echo "SOAK_FINISHED rc=${locust_rc} csv=${CSV_PREFIX}"
              echo "sleeping so kubectl cp can collect /results; delete the Job when done"
              sleep infinity
          env:
            - name: STAFF_API_BASE
              value: http://farmer-registry-staff-portal-api.perftest.svc.cluster.local
            - name: IN_CLUSTER_SOAK
              value: "1"
            - name: STAFF_API_HEADLESS
              value: locust-staff-api-pods.perftest.svc.cluster.local
            - name: STAFF_API_POD_PORT
              value: "8000"
            - name: SOAK_USERS
              value: "36"
            - name: SOAK_MAX_RPS
              value: "172"
            - name: PERF_SEED_DIR
              value: /perf-seed
            - name: KEYCLOAK_BASE
              value: http://commons-keycloak.perftest.svc.cluster.local
            - name: KEYCLOAK_REALM
              value: staff
            - name: OIDC_CLIENT_ID
              value: farmer-registry-staff-portal
          envFrom:
            - secretRef:
                name: locust-staff-soak
          volumeMounts:
            - name: results
              mountPath: /results
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: results
          emptyDir: {}
